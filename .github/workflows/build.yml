name: Native SoundCloud Player
on:
  push:
    branches: [main, native-player-v1]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and unit tests
        run: |
          python -m compileall -q native/soundcloud_cardputer
          PYTHONPATH=native python -m unittest discover -s tests -p 'test_core.py' -v
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          chmod +x build_deb.sh
          ./build_deb.sh
          dpkg-deb --info dist/soundcloud-cardputer_1.0.6_all.deb
          dpkg-deb --contents dist/soundcloud-cardputer_1.0.6_all.deb
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-cardputer-deb
          path: dist/*.deb
          if-no-files-found: error
      - name: Publish latest package
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Latest native build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*.deb
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
