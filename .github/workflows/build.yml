name: Build and publish Cardputer package

on:
  push:
    branches: [main, native-player-v1, release/2.0-aurora-player]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Run syntax checks and tests
        run: |
          python -m pip install --upgrade Pillow
          python -m compileall -q native/soundcloud_cardputer
          PYTHONPATH=native python -m unittest discover -s tests -p 'test_core.py' -v

      - name: Build Debian package (GitHub runner only)
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh
          dpkg-deb --info dist/soundcloud-cardputer_2.1.1_all.deb
          dpkg-deb --contents dist/soundcloud-cardputer_2.1.1_all.deb
          sha256sum dist/soundcloud-cardputer_2.1.1_all.deb > dist/SHA256SUMS.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-cardputer-2.1.1
          path: |
            dist/soundcloud-cardputer_2.1.1_all.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish AURORA 2.1 release
        if: github.ref == 'refs/heads/release/2.0-aurora-player'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          target_commitish: ${{ github.sha }}
          name: SoundCloud Cardputer AURORA 2.1
          body: |
            Prebuilt Debian package for Cardputer Zero (ARM64 / Debian 13).

            Install on the Cardputer over SSH; no compiling or building is performed on the device.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            dist/soundcloud-cardputer_2.1.1_all.deb
            dist/SHA256SUMS.txt

      - name: Publish versioned tag release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v2.1.1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soundcloud-cardputer_2.1.1_all.deb
            dist/SHA256SUMS.txt
